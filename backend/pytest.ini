[pytest]
asyncio_mode = auto
testpaths = tests
; A hang here (event-loop/thread misuse in websocket or Celery-worker code is the likely
; culprit — see tests/test_websocket.py and tests/test_migration_runner.py) should fail loudly
; instead of silently stalling CI or a local run; --timeout-method=thread also dumps every
; thread's stack on timeout, which is what actually diagnosed the last one.
timeout = 120
timeout_method = thread
